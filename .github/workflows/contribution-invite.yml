name: Invite approved contributors
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Approved contribution Issue number to retry'
        required: true
        type: string
permissions:
  contents: read
  issues: write
concurrency:
  group: contribution-invite-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  invite:
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'accepted' && contains(github.event.issue.labels.*.name, 'contribution'))
    runs-on: ubuntu-24.04
    environment: contribution-invites
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Invite the author of an approved contribution
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTRIBUTION_INVITE_TOKEN: ${{ secrets.CONTRIBUTION_INVITE_TOKEN }}
        run: node scripts/contribution-invite.mjs
