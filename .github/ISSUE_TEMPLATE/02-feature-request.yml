name: 功能建议
description: 提出新功能或改进现有功能的建议。
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有建议，并说明具体使用场景和希望解决的问题。
        若现有功能报错或无法使用，请选择“问题反馈”，提供复现信息。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与遇到的问题
      description: 你想完成什么任务？目前在哪一步遇到了困难？请举一个具体例子。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望增加或改进的功能
      description: 描述你希望如何操作，以及最终应得到什么结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方式
      description: 目前如何完成这件事？这些方式有什么不足？没有替代方式也可以说明。
  - type: input
    id: platforms
    attributes:
      label: 适用平台
      description: 说明建议涉及的主机或客机系统；适用于所有平台时填写“全部平台”。
      placeholder: 全部平台 / Windows 主机 / macOS 客机 / Linux 主机
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 当前 Cage 版本
      description: 如建议与现有功能有关，请填写版本号；源码构建可同时填写提交号。
  - type: textarea
    id: context
    attributes:
      label: 参考资料与补充信息
      description: 可附示意图、类似功能链接或预期使用流程；上传前请移除敏感信息。
